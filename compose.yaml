# Local/self-hosted single instance. Put an HTTPS reverse proxy in front (see docs/OPERATIONS.md).
services:
  tabletop:
    build: .
    restart: unless-stopped
    environment:
      ORIGIN: ${ORIGIN:-http://127.0.0.1:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - tabletop-data:/data
    stop_grace_period: 15s
volumes:
  tabletop-data:
